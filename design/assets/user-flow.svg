<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1130" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">Mini Film Director screen connections</title><desc id="flow-desc">Shoot, guided takes, edit, save and projects form the main path. Idea, shot plan, reference, settings, take review, captions and cover are optional paths. Every screen link opens the prototype. Recording, media and speech are simulated.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#eb6847"/></marker><marker id="optional-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#999082"/></marker></defs><style>text{font-family:system-ui,-apple-system,sans-serif;fill:#2b2a25}.node-title{font-family:Georgia,serif;font-size:29px}.node-desc{font-size:13px;fill:#716b60}.label{font-size:13px;fill:#a34b31}.optional-label{font-size:12px;fill:#82796b}.node:hover rect{stroke:#eb6847;stroke-width:2}.node:focus rect{stroke:#eb6847;stroke-width:4}.edge{fill:none;stroke:#eb6847;stroke-width:2;marker-end:url(#arrow)}.optional-edge{fill:none;stroke:#999082;stroke-width:1.5;stroke-dasharray:5 5;marker-end:url(#optional-arrow)}</style><path class="edge" d="M700 170 V275"/><text class="label" x="775" y="228" text-anchor="middle">Start shoot</text><path class="edge" d="M700 385 V490"/><text class="label" x="775" y="443" text-anchor="middle">Sequence complete</text><path class="edge" d="M700 600 V705"/><text class="label" x="775" y="658" text-anchor="middle">Save project</text><path class="edge" d="M700 815 V920"/><text class="label" x="775" y="873" text-anchor="middle">View saved projects</text><path class="edge" d="M860 322 H900 Q930 322 930 292 V105 Q930 85 910 85 H860"/><text class="label" x="917" y="213" text-anchor="middle">Stop / pause</text><path class="edge" d="M540 975 H505 Q475 975 475 940 V780 Q475 760 505 760 H540"/><text class="label" x="503" y="874" text-anchor="middle">Open</text><g class="optional"><path class="optional-edge" d="M540 110 H400"/><text class="optional-label" x="470" y="99" text-anchor="middle">Edit idea</text><path class="optional-edge" d="M240 170 V275"/><text class="optional-label" x="285" y="221" text-anchor="middle">Review plan</text><path class="optional-edge" d="M400 330 H540"/><text class="optional-label" x="470" y="319" text-anchor="middle">Start shoot</text><path class="optional-edge" d="M240 170 H35 V545 H80"/><text class="optional-label" x="68" y="360" text-anchor="middle">Use reference</text><path class="optional-edge" d="M240 490 V385"/><text class="optional-label" x="300" y="442" text-anchor="middle">Use reviewed sample</text><path class="optional-edge" d="M860 110 H1000" marker-start="url(#optional-arrow)"/><text class="optional-label" x="930" y="99" text-anchor="middle">Settings / Back</text><path class="optional-edge" d="M860 545 H960 V420 H1000"/><text class="optional-label" x="934" y="489" text-anchor="middle">Review take</text><path class="optional-edge" d="M1000 440 H920 V577 H860"/><text class="optional-label" x="949" y="566" text-anchor="middle">Keep</text><path class="optional-edge" d="M1160 365 V232 H975 V347 H860"/><text class="optional-label" x="1060" y="219" text-anchor="middle">Retake · then Start</text><path class="optional-edge" d="M860 545 H900 V630 H1000"/><text class="optional-label" x="945" y="613" text-anchor="middle">Finishing touches</text><path class="optional-edge" d="M860 570 H940 V840 H1000"/><text class="optional-label" x="933" y="765" text-anchor="middle">Choose cover</text><path class="optional-edge" d="M1000 660 H960 V595 H860"/><text class="optional-label" x="979" y="705" text-anchor="middle">Back to edit</text><path class="optional-edge" d="M1000 845 H970 V610 H860"/><text class="optional-label" x="1000" y="820" text-anchor="middle">Back to edit</text><path class="optional-edge" d="M540 1000 H15 V90 H80"/><text class="optional-label" x="57" y="1046" text-anchor="middle">New film</text></g><a class="node" href="../index.html#camera" target="_blank" aria-label="Open Your shoot"><rect x="540" y="60" width="320" height="110" rx="18" fill="#fbede4" stroke="#edb59e"/><text x="562" y="107" class="node-title">Your shoot</text><text x="562" y="137" class="node-desc">Your idea + one next instruction</text></a><a class="node" href="../index.html#direction" target="_blank" aria-label="Open Guided takes"><rect x="540" y="275" width="320" height="110" rx="18" fill="#fbede4" stroke="#edb59e"/><text x="562" y="322" class="node-title">Guided takes</text><text x="562" y="352" class="node-desc">Cue → countdown → take → Cut</text></a><a class="node" href="../index.html#reel" target="_blank" aria-label="Open Your reel"><rect x="540" y="490" width="320" height="110" rx="18" fill="#fbede4" stroke="#edb59e"/><text x="562" y="537" class="node-title">Your reel</text><text x="562" y="567" class="node-desc">Review the takes and shape the edit</text></a><a class="node" href="../index.html#project" target="_blank" aria-label="Open Save project"><rect x="540" y="705" width="320" height="110" rx="18" fill="#fbede4" stroke="#edb59e"/><text x="562" y="752" class="node-title">Save project</text><text x="562" y="782" class="node-desc">Name it and keep the editable work</text></a><a class="node" href="../index.html#projects" target="_blank" aria-label="Open Your projects"><rect x="540" y="920" width="320" height="110" rx="18" fill="#fbede4" stroke="#edb59e"/><text x="562" y="967" class="node-title">Your projects</text><text x="562" y="997" class="node-desc">Open a saved film or download a backup</text></a><a class="node optional" href="../index.html#brief" target="_blank" aria-label="Open Your idea"><rect x="80" y="60" width="320" height="110" rx="18" fill="#fffdf9" stroke="#ddd5c8"/><text x="102" y="107" class="node-title">Your idea</text><text x="102" y="137" class="node-d