esc">Choose an opening frame concept</text></a><text x="700" y="1088" text-anchor="middle" class="node-desc">Three app destinations: Shoot · Edit · Projects</text><text x="700" y="1111" text-anchor="middle" class="node-desc">Pre-event wireframe · sample takes · project backups contain JSON, no videos</text></svg>