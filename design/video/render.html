<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mini Film Director guided demo renderer</title><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#f5f2ec;color:#262721;font-family:Arial,sans-serif}#canvas{position:relative;width:1920px;height:1080px}#brand{position:absolute;left:110px;top:64px;font-size:24px;letter-spacing:5px}#brand b{color:#ef6542;margin-right:14px}#qualifier{position:absolute;right:110px;top:64px;font-size:20px;color:#827c70;letter-spacing:2px}#eyebrow{position:absolute;left:110px;top:202px;font-size:23px;letter-spacing:3px;color:#9b553e}h1{position:absolute;left:108px;top:236px;width:960px;margin:0;font:82px/1.1 Georgia,serif;letter-spacing:-2px;white-space:pre-line}#points{position:absolute;left:110px;top:490px;width:990px;font-size:30px;line-height:1.45}#points>div{margin:13px 0;display:flex;gap:16px;align-items:flex-start}#points i{background:#ef6542;width:9px;height:9px;border-radius:50%;margin-top:17px;flex-shrink:0}#flow{position:absolute;left:110px;top:675px;display:flex;align-items:center;gap:20px;font-size:24px}#flow span{padding:14px 24px;border:1px solid #d8d2c6;border-radius:30px;background:#fffdfa}#flow span.active{background:#262721;color:white;border-color:#262721}#flow em{color:#b2a999;font-style:normal}#caption{position:absolute;left:110px;top:800px;width:980px;min-height:136px;font-size:29px;line-height:1.45;color:#5b5a51;padding-top:20px;border-top:1px solid #d4cfc4}#phone{position:absolute;right:145px;top:117px;width:414px;height:849px;object-fit:contain;filter:drop-shadow(0 26px 28px #25231f18)}#footer{position:absolute;left:110px;bottom:44px;color:#857d70;font-size:20px}#counter{position:absolute;right:110px;bottom:44px;font-size:20px;color:#857d70}#progress{position:absolute;bottom:0;left:0;height:5px;background:#ef6542;width:0}
</style></head><body><main id="canvas"><div id="brand"><b>●</b> MINI FILM DIRECTOR</div><div id="qualifier">DESIGN WALKTHROUGH · 05 OCT 2026</div><div id="eyebrow"></div><h1></h1><div id="points"></div><div id="flow"><span>Shoot</span><em>→</em><span>Edit</span><em>→</em><span>Projects</span></div><div id="caption"></div><img id="phone" alt="Actual public synthetic phone wireframe"><div id="footer">Simulation · No live sensors or model running in this website</div><div id="counter"></div><div id="progress"></div></main><script>
window.renderFrame=(time,scenes)=>{let index=scenes.findIndex(s=>time<s.start+s.duration);if(index<0)index=scenes.length-1;const s=scenes[index],local=Math.max(0,time-s.start);document.querySelector('#eyebrow').textContent=s.eyebrow;document.querySelector('h1').textContent=s.title;document.querySelector('#points').innerHTML=s.points.map((p,i)=>`<div style="opacity:${Math.min(1,Math.max(0,(local-i*.22)/.4))};transform:translateX(${Math.max(0,1-local/.65)*12}px)"><i></i><span>${p}</span></div>`).join('');let screen=s.screen;if(s.id==='countdown'){screen=local<s.duration/3?'countdown3':local<2*s.duration/3?'countdown2':'countdown1';}document.querySelector('#phone').src='assets/'+screen+'.png';document.querySelector('#caption').textContent=s.narration;document.querySelectorAll('#flow span').forEach((el,i)=>el.classList.toggle('active',i===s.stage));document.querySelector('#counter').textContent=`${String(index+1).padStart(2,'0')} / ${scenes.length}`;const total=scenes[scenes.length-1].start+scenes[scenes.length-1].duration;document.querySelector('#progress').style.width=`${100*Math.min(1,time/total)}%`;};
</script></body></html>
