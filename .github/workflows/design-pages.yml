name: Publish design prototype

on:
  push:
    branches: [codex/film-director-research]
    paths: [design/**, .github/workflows/design-pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: design-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: design
      - name: Deploy design
        id: deployment
        uses: actions/deploy-pages@v4
